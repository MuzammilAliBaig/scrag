# Render free tier - a single service. FastAPI serves the landing page at /
# and the JSON API, so there is no second frontend host to configure.
#
# Free instances sleep after ~15 minutes idle and cold-start on the next
# request. That is accepted (see DEPLOY.md); /ready and the UI warming banner
# make it visible rather than confusing.
#
# ANTHROPIC_API_KEY is marked sync:false so it is NEVER stored in this file or
# in git. Set it in the Render dashboard under Environment.

services:
  - type: web
    name: scrag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the dashboard; never committed
      - key: PORT
        value: "8501"
