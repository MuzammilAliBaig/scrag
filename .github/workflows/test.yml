name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Model downloads only. No generation happens in this job, so no key is
      # needed and none is provided - the tests fake the generator.
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch. The default PyPI wheel drags in CUDA libraries that are
      # several GB of dead weight on a CI runner.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          pip install -r requirements.txt

      # The NLI verifier checkpoint is ~370 MB. Downloading it on every push
      # burns minutes for no reason.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Run tests
        run: pytest tests/ -q --durations=10

      - name: Summarise
        if: always()
        run: echo "Unit tests finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
