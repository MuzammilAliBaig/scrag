name: eval gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_paid_eval:
        description: "Also run the metrics that call the Claude API (costs money)"
        type: boolean
        default: false
      simulate_regression:
        description: "Force a metric value to prove the gate fires, e.g. citation_recall=0.60"
        type: string
        default: ""

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: ${{ github.workspace }}/.hf
      # Deterministic seeding. An LLM in the loop is non-deterministic enough
      # without the harness adding its own variance; a flaky gate gets disabled
      # within a week and then protects nothing.
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          pip install -r requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: hf-${{ runner.os }}-

      # The Wikipedia corpus and FAISS index are rebuildable but slow. Keyed on
      # the chunker and retrieval settings, so a change to either rebuilds.
      - name: Cache corpus and index
        uses: actions/cache@v4
        with:
          path: |
            data/corpus
            data/indexes
          key: corpus-${{ runner.os }}-${{ hashFiles('core/retriever.py', 'eval/corpus.py') }}
          restore-keys: corpus-${{ runner.os }}-

      # Cached Claude responses. This is what keeps the eval job free: the
      # citation metrics are computed from generations already on disk, and
      # only a genuinely new code path costs anything.
      - name: Cache Claude responses
        uses: actions/cache@v4
        with:
          path: eval/results/.api_cache
          key: api-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: api-cache-${{ runner.os }}-

      - name: Build corpus and index (skipped when cached)
        run: |
          if [ ! -f data/indexes/corpus.faiss ]; then
            python -m eval.build_index --split dev --limit 200 --distractors 800
          else
            echo "index restored from cache"
          fi

      # ---- FREE metrics: no API calls, run on every push ------------------
      - name: Retrieval hit rate
        run: python -m eval.check_retrieval --split dev --limit 200

      - name: Module B benchmark
        run: |
          if [ -d data/models/evaluator ]; then
            python -m eval.run_evaluator_bench --split test
          else
            echo "::warning::Module B checkpoint absent; its metrics will report MISSING"
          fi

      - name: Citation precision/recall from cached generations
        continue-on-error: true
        run: python -m eval.run_citation_pr --limit 200

      # ---- PAID metrics: opt-in only --------------------------------------
      # Every run of this step spends real money on the only paid component in
      # the project. It is deliberately not on the push trigger.
      - name: Paid eval subset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid_eval }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::run_paid_eval requested but the ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi
          python -m eval.run_citation_bench --dataset alce --limit 50 --quiet
          python -m eval.run_baseline --split dev --limit 50 --quiet

      # ---- THE GATE -------------------------------------------------------
      - name: Regression gate
        run: |
          ARGS=""
          for pair in ${{ inputs.simulate_regression }}; do
            ARGS="$ARGS --simulate $pair"
          done
          python -m eval.check_regression $ARGS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/*.json
          if-no-files-found: warn
